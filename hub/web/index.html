<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Scenix</title>
<!--
  Scenix — one web UI, thin native shells.

  This file is the whole front-end's entry point. The hub serves it at `/` and every file it loads at
  `/ui/<file>`, so every asset URL and every `import` below is root-relative (`/ui/js/…`). There is no
  build step and no framework: open the URL and it runs.

  Screens, cards and rows are plugins registered by the modules under /ui/js/. Nothing here names any
  content: the hub's `/app/v1/home` decides what the household sees.
-->
<link rel="icon" href="/ui/assets/scenix-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<!-- The billboard, the detail page and the player chrome. Loaded after app.css on purpose: it overrides
     app.css's shapes for those screens and adds the elements they draw, and it never redefines a token. -->
<link rel="stylesheet" href="/ui/css/screens.css">
<link rel="stylesheet" href="/ui/css/hero.css">
<!-- The pack layer: layout, card treatments and focus effects chosen by the theme. -->
<link rel="stylesheet" href="/ui/css/packs.css">
</head>
<body>
  <!-- The screen router mounts one screen at a time into #stage. -->
  <div id="stage"></div>

  <!-- The only two <video> elements in the product live here, created and driven by /ui/js/video.js. -->
  <div id="video-host" aria-hidden="true"></div>

  <!-- Modals, option menus, keypads and status lines. -->
  <div id="layer"></div>

  <noscript>
    <div class="boot-error">Scenix needs JavaScript. The hub is serving the interface; the browser is not running it.</div>
  </noscript>

  <div id="boot" class="boot">

      webfont arrives, and one path per letter lets the mark build itself left-to-right (the CSS does that
      in app.css under "The intro"). /ui/assets/scenix-wordmark.svg is the same artwork for anything that
      wants it as an image, including the Android shell.
    -->
