<meta name="theme-color" content="#141414">
<title>Scenix</title>
<!--
  Scenix — one web UI, thin native shells.

  This file is the whole front-end's entry point. The hub serves it at `/` and every file it loads at
  `/ui/<file>`, so every asset URL and every `import` below is root-relative (`/ui/js/…`). There is no
  build step and no framework: open the URL and it runs.

  Screens, cards and rows are plugins registered by the modules under /ui/js/. Nothing here names any
  content: the hub's `/app/v1/home` decides what the household sees.
-->
<link rel="icon" href="/ui/assets/scenix-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <!-- The screen router mounts one screen at a time into #stage. -->
  <div id="stage"></div>

  <!-- The only two <video> elements in the product live here, created and driven by /ui/js/video.js. -->
  <div id="video-host" aria-hidden="true"></div>

  <!-- Modals, option menus, keypads and status lines. -->
  <div id="layer"></div>

  <noscript>
    <div class="boot-error">Scenix needs JavaScript. The hub is serving the interface; the browser is not running it.</div>
  </noscript>
