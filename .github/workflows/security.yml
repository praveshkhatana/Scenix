name: Security

# Supply-chain and code scanning for Scenix.
#
# The repository is a monorepo with two build roots:
#   app/  Android TV client (Gradle wrapper lives in app/, not at the repo root)
#   hub/  Node.js hub (built-ins only, no package.json today)
#
# Everything here runs on a public GitHub repository with the free GitHub-hosted
# runners and no paid code-security features. CodeQL and Semgrep publish SARIF;
# gitleaks, dependency-review and the Android build fail the run on findings.
#
# Triggers:
#   - every pull request
#   - pushes to main and games-mode
#   - pushes of release tags (v*)
#   - manual workflow_dispatch
#
# The release-scan job only runs for workflow_dispatch and tag pushes. It builds
# the release APK when possible, publishes its SHA-256, and calls VirusTotal only
# when the optional VT_API_KEY secret is present.

on:
  pull_request:
  push:
    branches:
      - main
      - games-mode
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default. Jobs that publish SARIF add security-events: write.
permissions:
  contents: read

# A new push to the same PR/branch cancels the previous run. Tags get their own
# group, so a tag build cannot be cancelled by an unrelated branch push.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned scanner images (version tags are immutable on Docker Hub).
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The Kotlin extractor needs a usable JDK and Android SDK even when the
      # autobuilder finds app/ on its own.
      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Java/Kotlin has to be built. Try the autobuilder first; the Gradle root
      # is app/, not the repo root, so a manual fallback is provided below.
      - name: Autobuild compiled languages
        id: autobuild
        if: matrix.build-mode == 'autobuild'
        continue-on-error: true
        uses: github/codeql-action/autobuild@v4

      - name: Manual build fallback (app/ Gradle module)
        if: matrix.build-mode == 'autobuild' && steps.autobuild.outcome == 'failure' && hashFiles('app/gradlew') != ''
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Semgrep (official container)
        env:
          # Avoid accidentally enabling Semgrep AppSec Platform in CI.
          SEMGREP_APP_TOKEN: ""
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e SEMGREP_APP_TOKEN \
            -v "$PWD:/src" \
            -w /src \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --config p/secrets \
              --severity ERROR \
              --error \
              --metrics=off \
              --sarif \
              --output semgrep.sarif \
              --exclude app/build \
              --exclude app/.gradle \
              --exclude hub/node_modules \
              --exclude hub/data \
              --exclude hub/media \
              --exclude shots \
              --exclude refs \
              --exclude qa \
              --exclude design \
              --exclude design-contracts \
              --exclude "*.apk"

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail

          # The gitleaks container image has the gitleaks entrypoint and bundles
          # git, so arguments are passed as subcommands (no license key needed).
          # The `git` subcommand takes the repository as a positional argument.
          args=(--no-banner git --verbose --redact --exit-code 1)

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Only the commits introduced by the PR on a pull request.
            args+=(--log-opts "${PR_BASE_SHA}..${PR_HEAD_SHA}")
          fi
          args+=(.)

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/repo" \
            -w /repo \
            "${GITLEAKS_IMAGE}" \
            "${args[@]}"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  android:
    name: Android lint + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for the app module
        id: app
        run: |
          if [ -f app/settings.gradle ] && [ -f app/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app/ Gradle module found; skipping Android build."
          fi

      - name: Set up JDK 17
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app/*.gradle*
            app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        if: steps.app.outputs.present == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Lint and build debug APK
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scenix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scenix-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  release-scan:
    name: Release APK + VirusTotal
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for the app module
        id: app
        run: |
          if [ -f app/settings.gradle ] && [ -f app/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app/ Gradle module found; nothing to release-scan."
          fi

      - name: Set up JDK 17
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app/*.gradle*
            app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        if: steps.app.outputs.present == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # Release signing is not configured in this repository yet (the Gradle
      # file falls back to the debug key). Build best-effort so an unconfigured
      # or R8-failing release does not hide the checksum/VT step.
      - name: Build release APK (best effort)
        id: release-build
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK and compute SHA-256
        id: apk
        if: steps.app.outputs.present == 'true'
        run: |
          set -euo pipefail

          apk=""
          if [ -d app/build/outputs/apk/release ]; then
            apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          fi

          if [ -z "$apk" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release APK was produced; skipping checksum and VirusTotal."
            exit 0
          fi

          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$(basename "$apk")" > release-apk.sha256

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=${apk}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

          {
            echo "### Release artifact"
            echo ""
            echo "- APK: \`$(basename "$apk")\`"
            echo "- SHA-256: \`${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK and checksum
        if: steps.apk.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scenix-release-apk
          path: |
            ${{ steps.apk.outputs.path }}
            release-apk.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: VirusTotal scan (optional secret)
        if: steps.apk.outputs.found == 'true'
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          # Check the environment in the shell, not in an `if: secrets...`
          # expression: secrets are not available to job/step conditions.
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::notice title=VirusTotal skipped::VT_API_KEY is not configured. The APK and SHA-256 were still produced."
            exit 0
          fi

          chmod +x scripts/virustotal-scan.sh
          scripts/virustotal-scan.sh "${{ steps.apk.outputs.path }}"
