<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;font-family:"Helvetica Neue",Arial,sans-serif;color:#fff;padding:28px}
h2{font-size:20px;margin:0 0 18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,984px);gap:28px}
figure{margin:0}
figure>div{width:984px;height:554px;overflow:hidden;border:1px solid #333;border-radius:6px;position:relative}
iframe{width:1920px;height:1080px;border:0;transform:scale(.5125);transform-origin:0 0}
figcaption{font-size:16px;color:#bbb;padding:8px 2px 0}
</style></head><body>
<h2>GHARTV — Netflix-style UI for the Sony BRAVIA (1920&times;1080, D-pad focus)</h2>
<div class="grid">
<figure><div><iframe src="netflix-ui.html#profiles"></iframe></div><figcaption>1 · Who's watching — kid profiles need no PIN</figcaption></figure>
<figure><div><iframe src="netflix-ui.html#home"></iframe></div><figcaption>2 · Home — billboard, category chips, Continue Watching, Top 10</figcaption></figure>
<figure><div><iframe src="netflix-ui.html#live"></iframe></div><figcaption>3 · Live TV — same tiles/rows as movies, 444 channels</figcaption></figure>
<figure><div><iframe src="netflix-ui.html#title"></iframe></div><figcaption>4 · Title — one tile, "Play from" with 3 merged sources</figcaption></figure>
<figure><div><iframe src="netflix-ui.html#player"></iframe></div><figcaption>5 · Player — Skip Intro, subs/audio, quality ceiling, buffer read-out</figcaption></figure>
<figure><div><iframe src="netflix-ui.html#kids"></iframe></div><figcaption>6 · Kids profile — bright tiles, daily limit, no free search</figcaption></figure>
<figure><div><iframe src="netflix-ui.html#pin"></iframe></div><figcaption>7 · Profile lock — PIN only to leave a kids profile; per-profile switches</figcaption></figure>
</div></body></html>
