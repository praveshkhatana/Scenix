// Scenix — Android TV app (P1 skeleton). Kotlin + Views, no Compose, no Glide/Coil,
// no Hilt/Retrofit/kotlinx-serialization: Sony BRAVIA, Android 11, armeabi-v7a, 2 GB RAM.
plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// ---- the character faces, not a web UI ---------------------------------------------------------
// The television is native now: its Home, sections, Detail, Search, Settings and Player never load a
// WebView. The only hub-owned assets the APK still needs are the character list and cached faces the
// native profile screen offers. A build step carries those in from the hub tree so there is one copy.
//
// The hub sits next to this app in the repository, and further up in a working copy checked out beside it,
// so it is found by walking up until a directory holds `hub/web/index.html`. `-Pscenix.hub=<dir>` says so
// outright for any other layout.
def hubRoot = {
    def asked = findProperty('scenix.hub')
    if (asked) return file(asked)
    def dir = projectDir.parentFile
    for (int up = 0; up < 6 && dir != null; up++) {
        for (def cand : [new File(dir, 'hub'), new File(dir, 'Scenix/hub')]) {
            if (new File(cand, 'web/index.html').isFile()) return cand
        }
        dir = dir.parentFile
    }
    return null
}()

// Faces for the profile screen: the list this box offers, plus the bytes it has already cached. A TV asks
// its own backend for a face and never learns a third-party hostname, so the offline start screen still
// shows the characters a household chose.
def hubUiDir = layout.buildDirectory.dir('generated/scenixAssets')
// The design system's catalog manifest and fixtures are the same files the repository's gates read.
// Carried in at build time so the Studio cannot show a component the contract folder does not know.
def studioAssetsDir = layout.buildDirectory.dir('generated/studioAssets')

// ---- release signing is declared, not assumed ---------------------------------------------------
// This build declares a release signing config, so AGP validates its store and alias even
// for unit tests. These properties are deliberately not checked in; supply them from the
// Gradle properties file or CI secret.  A missing/incorrect file must not be silently
// downgraded: it would make a debug-signed APK look like a distributable release.
def releaseSigningPropertyNames = [
    'scenix.release.storeFile',
    'scenix.release.storePassword',
    'scenix.release.keyAlias',
    'scenix.release.keyPassword',
]
def releaseSigningValues = releaseSigningPropertyNames.collectEntries { propertyName ->
    def value = findProperty(propertyName)?.toString()
    [(propertyName): value ?: null]
}
def missingReleaseSigningProperties = releaseSigningValues.findAll { _, value ->
    value == null || value.trim().isEmpty()
}.keySet()
def releaseStoreFile = releaseSigningValues['scenix.release.storeFile'] ?
    file(releaseSigningValues['scenix.release.storeFile']) : null
def releaseSigningProblem = !missingReleaseSigningProperties.isEmpty() ?
    "missing Gradle properties: ${missingReleaseSigningProperties.join(', ')}" :
    (!releaseStoreFile?.isFile() ? 'scenix.release.storeFile does not point to a readable keystore' : null)
def releaseSigningReady = releaseSigningProblem == null
def packageTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def name = taskName.toLowerCase()
    name.contains('assemble') || name.contains('bundle') || name.contains('package') ||
        name.contains('sign') || name.contains('install')
}
if (packageTaskRequested && !releaseSigningReady) {
    throw new GradleException("Packaging is disabled until release signing is configured: " +
        releaseSigningProblem + ".")
}
if (releaseStoreFile && !releaseStoreFile.isFile()) {
    logger.warn("Scenix release keystore is unavailable (${releaseSigningProblem}); " +
        'test/debug builds remain available.')
}

def propertiesIsTruthy = { value ->
    def text = value?.toString()?.trim()?.toLowerCase()
    text && !['false', '0', 'no', 'off'].contains(text)
}

// A preview release is still signed with the release key (a distinct applicationId can
// legitimately replace its own earlier preview), but it must not masquerade as the canonical
// production package.  Require the explicit, non-default opt-in at the invocation.
def previewRequested = propertiesIsTruthy(findProperty('scenix.preview.enabled'))
def previewApplicationId = findProperty('scenix.preview.applicationId')?.toString()?.trim()
def previewVersionCodeText = findProperty('scenix.preview.versionCode')?.toString()?.trim()
def previewVersionName = findProperty('scenix.preview.versionName')?.toString()?.trim()
def previewRequestedVersionCode = previewVersionCodeText ?
    previewVersionCodeText.isInteger() ? Integer.parseInt(previewVersionCodeText) : -1 : 0
def previewProblem = null
if (previewRequested) {
    if (!propertiesIsTruthy(findProperty('scenix.preview.allow'))) {
        previewProblem = 'scenix.preview.enabled requires explicit scenix.preview.allow=true'
    } else if (previewApplicationId != 'com.scenix.tv.preview') {
        previewProblem = 'scenix.preview.applicationId must remain the reserved com.scenix.tv.preview identity'
    } else if (!previewVersionName || previewVersionCodeText == null || previewRequestedVersionCode <= 0) {
        previewProblem = 'scenix.preview.versionCode and a non-empty scenix.preview.versionName are required'
    } else if (previewRequestedVersionCode == android.defaultConfig.versionCode) {
        previewProblem = "preview versionCode must not overwrite the release package (${previewRequestedVersionCode})"
    }
    if (previewProblem != null) throw new GradleException("Invalid preview release configuration: ${previewProblem}.")
}

android {
    namespace 'com.scenix.tv'
    compileSdk 34

    sourceSets {
        main {
            assets.srcDirs += hubUiDir
            assets.srcDirs += studioAssetsDir
        }
    }

    defaultConfig {
        applicationId 'com.scenix.tv'
        minSdk 26          // the TV is Android 11 (SDK 30); 26 keeps the floor honest
        targetSdk 34
        // A release and its preview are separately versioned identities.  They must not
        // implicitly replace one another on a TV.
        versionCode 5
        versionName '0.2-p5'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }  // GeckoView's x86_64 is dead weight on TVs
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile releaseStoreFile
                storePassword releaseSigningValues['scenix.release.storePassword']
                keyAlias releaseSigningValues['scenix.release.keyAlias']
                keyPassword releaseSigningValues['scenix.release.keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // A local/CI check is a separate installed app, never an overwrite of production.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        // QA is a side-by-side test lane: same signing story as debug, its own identity
        // (com.scenix.tv.qa) so a soak on the television never replaces the release app, and
        // its own manifest (app/src/qa) that exports the harness activities production hides.
        qa {
            debuggable true
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    if (previewRequested) {
        buildTypes.create('preview') { buildType ->
            buildType.initFrom(release)
            buildType.applicationIdSuffix = '.preview'
            buildType.versionNameSuffix = '-preview'
            // A local checkout without the release key can exercise the preview lane too.
            // In that case it is an unsigned artifact and verify-android-artifact refuses it.
            if (releaseSigningReady) buildType.signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    base {
        archivesName = 'app'      // app/build/outputs/apk/debug/app-debug.apk
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

if (previewRequested) {
    android.applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'preview') {
            variant.mergedFlavor.applicationId = previewApplicationId
            variant.mergedFlavor.versionCode = previewRequestedVersionCode
            variant.mergedFlavor.versionName = previewVersionName
        }
    }
}

// Carried in at build time rather than checked in: the APK is a snapshot of the UI as it stands, and the
// repository never holds the same files twice.
def copyHubUi = tasks.register('copyHubUi', Copy) {
    group = 'scenix'
    description = 'Carry the character list and cached faces into the native profile assets.'
    onlyIf { hubRoot != null && new File(hubRoot, 'web/index.html').isFile() }
    into hubUiDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    if (hubRoot != null) {
        // The page this TV serves at :8787, carried in as a snapshot. `LoopbackServer` reads
        // `assets/web/...`; without it the address the app prints has nothing behind it.
        from(new File(hubRoot, 'web')) {
            include '**'
            exclude '**/prototypes/**'
            into 'web'
        }
        from(new File(hubRoot, 'characters.json')) { into 'characters' }
        from(new File(hubRoot, 'data/avatar-faces')) {
            include '**'
            into 'characters/faces'
        }
    }
}
def copyStudio = tasks.register('copyStudio', Copy) {
    group = 'scenix'
    description = 'Carry design-system/studio.json and its fixtures into the APK as assets.'
    into studioAssetsDir
    from(new File(projectDir.parentFile, 'design-system/studio.json'))
    from(new File(projectDir.parentFile, 'design-system/fixtures')) { into 'fixtures' }
}
tasks.named('preBuild') { dependsOn copyHubUi, copyStudio }
if (hubRoot == null) {
    logger.warn("scenix: no hub found near ${projectDir}, so this APK carries no character faces. " +
        'Pass -Pscenix.hub=<dir> to point at one.')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // DefaultMediaSourceFactory picks the source by URL with reflection: an .m3u8 live channel
    // throws ClassNotFoundException (HlsMediaSource$Factory) unless these modules are on the
    // classpath. Every IPTV tile in the hub is HLS, so this is what live playback runs on.
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    // Firefox's embeddable engine: the multithreaded WASM ports (catalog coi flag) need
    // SharedArrayBuffer, which Android WebView never grants. GeckoView carries it, in-app.
    // Pinned to the 128 ESR: its transitive deps (core 1.13.1, kotlin 1.9.24) are exactly this
    // project's toolchain — newer GV builds demand compileSdk 35+ and break AGP 8.5.2.
    implementation 'org.mozilla.geckoview:geckoview:128.0.20240725162350'

    // Standalone torrent engine: libtorrent compiled for this TV's 32-bit ARM ABI.
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-35'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-35'
    // The same engine for 64-bit ARM, so the APK also installs on an arm64 TV emulator.
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-35'

    // The glass of the Liquid Glass pack. Our own frost was a blurred bitmap: it had no lens, so the
    // edge of a glass surface never bent the artwork behind it and the material read as flat grey
    // frosting. This library is the View-system equivalent of the iOS 26 material — a rounded-rect
    // SDF that bends the backdrop at the rim (API 33+), with a NEON blur + chromatic-aberration
    // pipeline underneath, which is the tier this Android 11 television actually runs.
    // MIT; `LiquidGlassKit.kt` is the only file that imports it, so the pack's numbers stay in tokens.
    implementation 'com.github.QWEA0:liquidglass:v2.0.11'

    // Phone-pairing QR is drawn by core/QrCode.kt: byte mode, error-correction M, no barcode library.
    testImplementation 'junit:junit:4.13.2'
}
