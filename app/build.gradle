// Scenix — Android TV app (P1 skeleton). Kotlin + Views/RecyclerView, no Compose, no Glide/Coil,
// no Hilt/Retrofit/kotlinx-serialization: Sony BRAVIA, Android 11, armeabi-v7a, 2 GB RAM.
plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'com.scenix.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.scenix.tv'
        minSdk 26          // the TV is Android 11 (SDK 30); 26 keeps the floor honest
        targetSdk 34
        versionCode 1
        versionName '0.1-p1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        // No abis restriction: the code is pure Kotlin, the same binary runs on 32- and 64-bit.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    base {
        archivesName = 'app'      // app/build/outputs/apk/debug/app-debug.apk
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }

    lint {
        abortOnError false      // warnings are fine for the P1 acceptance build
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // DefaultMediaSourceFactory picks the source by URL with reflection: an .m3u8 live channel
    // throws ClassNotFoundException (HlsMediaSource$Factory) unless these modules are on the
    // classpath. Every IPTV tile in the hub is HLS, so this is what live playback runs on.
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
}
