// Scenix — Android TV app (P1 skeleton). Kotlin + Views, no Compose, no Glide/Coil,
// no Hilt/Retrofit/kotlinx-serialization: Sony BRAVIA, Android 11, armeabi-v7a, 2 GB RAM.
plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// ---- one web UI, held in one place ---------------------------------------------------------------
// The interface is the hub's (`hub/web/`), not a copy that can drift. A build step carries it into a
// generated assets dir, so git holds a single copy and an APK ships whatever the UI changed minutes ago.
// The bundle keeps its own layout because LocalServer mounts it at `/ui/*`, which is how a hub serves it:
// the page's absolute paths (`/ui/js/app.js`) need no rewriting against either backend.
//
// The hub sits next to this app in the repository, and further up in a working copy checked out beside it,
// so it is found by walking up until a directory holds `hub/web/index.html`. `-Pscenix.hub=<dir>` says so
// outright for any other layout.
def hubRoot = {
    def asked = findProperty('scenix.hub')
    if (asked) return file(asked)
    def dir = projectDir.parentFile
    for (int up = 0; up < 6 && dir != null; up++) {
        for (def cand : [new File(dir, 'hub'), new File(dir, 'Scenix/hub')]) {
            if (new File(cand, 'web/index.html').isFile()) return cand
        }
        dir = dir.parentFile
    }
    return null
}()

// Faces for the profile screen: the list this box offers, plus the bytes it has already cached. A TV asks
// its own backend for a face and never learns a third-party hostname, so the offline start screen still
// shows the characters a household chose.
def hubUiDir = layout.buildDirectory.dir('generated/scenixAssets')

android {
    namespace 'com.scenix.tv'
    compileSdk 34

    sourceSets {
        main {
            assets.srcDirs += hubUiDir
        }
    }

    defaultConfig {
        applicationId 'com.scenix.tv'
        minSdk 26          // the TV is Android 11 (SDK 30); 26 keeps the floor honest
        targetSdk 34
        versionCode 1
        versionName '0.1-p1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        // No abis restriction: the code is pure Kotlin, the same binary runs on 32- and 64-bit.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    base {
        archivesName = 'app'      // app/build/outputs/apk/debug/app-debug.apk
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }

    lint {
        abortOnError false      // warnings are fine for the P1 acceptance build
        checkReleaseBuilds false
    }
}

// Carried in at build time rather than checked in: the APK is a snapshot of the UI as it stands, and the
// repository never holds the same files twice.
def copyHubUi = tasks.register('copyHubUi', Copy) {
    group = 'scenix'
    description = 'Carry the hub\'s web UI, its character list and its cached faces into the assets.'
    onlyIf { hubRoot != null && new File(hubRoot, 'web/index.html').isFile() }
    into hubUiDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    if (hubRoot != null) {
        from(new File(hubRoot, 'web')) {
            // `web/ui` is a link to `web` itself — it is how a hub answers /ui/<path> straight off disk —
            // and copying it would copy the tree into itself.
            exclude 'ui', 'ui/**'
            into 'web'
        }
        from(new File(hubRoot, 'characters.json')) { into 'characters' }
        from(new File(hubRoot, 'data/avatar-faces')) {
            include '**'
            into 'characters/faces'
        }
    }
}
tasks.named('preBuild') { dependsOn copyHubUi }
if (hubRoot == null) {
    logger.warn("scenix: no hub/web found near ${projectDir}, so this APK carries no web UI. " +
        'Pass -Pscenix.hub=<dir> to point at one.')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // DefaultMediaSourceFactory picks the source by URL with reflection: an .m3u8 live channel
    // throws ClassNotFoundException (HlsMediaSource$Factory) unless these modules are on the
    // classpath. Every IPTV tile in the hub is HLS, so this is what live playback runs on.
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
}
