// Scenix — single-module build: this directory IS the :app module, so the APK lands in
// app/build/outputs/apk/debug/app-debug.apk.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.mozilla.org/maven2/' }
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.mozilla.org/maven2/' }
    }
}
rootProject.name = 'scenix-tv'
