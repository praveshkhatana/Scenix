// Scenix — single-module build: this directory IS the :app module, so the APK lands in
// app/build/outputs/apk/debug/app-debug.apk.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.mozilla.org/maven2/' }
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.mozilla.org/maven2/' }
        // The Liquid Glass pack's glass itself (see `LiquidGlassKit.kt`): the library is published on
        // JitPack, not Maven Central. MIT, and the artifact is one 470 KB AAR with the NEON blur
        // already built for both of this APK's ABIs.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = 'scenix-tv'
