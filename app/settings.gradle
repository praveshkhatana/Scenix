// Scenix — single-module build: this directory IS the :app module, so the APK lands in
// app/build/outputs/apk/debug/app-debug.apk.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'scenix-tv'
