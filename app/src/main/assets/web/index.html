<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141414">
<title>Scenix</title>
<!--
  The page this TV loads when it is running on its own.

  It talks to exactly one thing: the `/app/v1` contract, fetched relative to wherever the page was served
  from. That is what lets the same file run against this device's own server and, unchanged, against a
  hub. Nothing here names a title, a household, a language or an address — the backend decides all of
  that, and the capabilities it states decide which buttons exist at all.

  Playback is not this page's job. A file is opened by handing it to the native player through `Scenix`,
  and that player draws underneath this transparent WebView, so while something is playing the page
  paints nothing but its own status line. No framework, no build step, no emoji: D-pad in, D-pad out.

  Sizes are the app's own theme lengths, design pixels on a 1920x1080 canvas scaled by the smaller axis
  exactly as Theme.kt scales them, so this page and the screens built in Kotlin agree.
-->
<style>
:root {
  --u: min(0.0521vw, 0.0926vh);
  --bg: #141414; --surface: #181818; --surface2: #232323; --line: #262626;
  --ink: #ffffff; --ink2: #b3b3b3; --ink3: #737373;
  --brand: #e50914; --match: #46d369; --kids: #f2c33a; --warn: #f2c33a; --ring: #ffffff;
  --gutter: calc(76 * var(--u));
  --gap: calc(20 * var(--u));
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Roboto", system-ui, sans-serif;
  font-size: calc(22 * var(--u));
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }

/* ---- the frame ---------------------------------------------------------------------------- */
#nav {
  position: fixed; inset: 0 0 auto 0; height: calc(96 * var(--u));
  display: flex; align-items: center; gap: calc(40 * var(--u));
  padding: 0 var(--gutter); z-index: 3;
  background: linear-gradient(180deg, rgba(20,20,20,.95), rgba(20,20,20,0));
}
#mark { font-size: calc(34 * var(--u)); font-weight: 700; letter-spacing: .08em; color: var(--brand); }
#tabs { display: flex; gap: calc(40 * var(--u)); }
#tabs button {
  background: none; border: 0; padding: calc(10 * var(--u)) 0;
  color: rgba(255,255,255,.8); font-size: calc(22 * var(--u));
}
#tabs button[aria-current] { color: var(--ink); border-bottom: calc(4 * var(--u)) solid var(--brand); }
#who { margin-left: auto; color: var(--ink3); font-size: calc(20 * var(--u)); }

#stage {
  position: absolute; inset: calc(96 * var(--u)) 0 0 0;
  overflow-y: auto; overflow-x: hidden;
  padding: calc(24 * var(--u)) 0 calc(60 * var(--u));
  scrollbar-width: none;
}
#stage::-webkit-scrollbar { display: none; }
.pad { padding: 0 var(--gutter); }

/* ---- rows and cards ----------------------------------------------------------------------- */
.rowtitle { font-size: calc(32 * var(--u)); font-weight: 700; margin: calc(34 * var(--u)) 0 calc(16 * var(--u)); }
.strip { display: flex; gap: var(--gap); overflow-x: auto; scrollbar-width: none; padding-bottom: calc(12 * var(--u)); }
.strip::-webkit-scrollbar { display: none; }
.card { flex: 0 0 auto; width: calc(280 * var(--u)); background: none; border: 0; padding: 0; text-align: left; }
.art {
  width: 100%; height: calc(187 * var(--u)); background: var(--surface2);
  border-radius: calc(6 * var(--u)); overflow: hidden; position: relative;
}
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--ink3); padding: calc(14 * var(--u)); text-align: center; }
.card .cap { margin-top: calc(10 * var(--u)); font-size: calc(19 * var(--u)); color: var(--ink2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge {
  position: absolute; top: calc(10 * var(--u)); left: calc(10 * var(--u));
  border: calc(2 * var(--u)) solid rgba(255,255,255,.35); border-radius: calc(4 * var(--u));
  padding: 0 calc(8 * var(--u)); font-size: calc(15 * var(--u)); color: var(--ink);
}
.badge.kids { border-color: var(--kids); color: var(--kids); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(6 * var(--u)); background: rgba(255,255,255,.18); }
.bar i { display: block; height: 100%; background: var(--brand); }

/* the D-pad ring: the same width, scale and colour the Kotlin screens draw */
button:focus, input:focus { outline: none; }
button:focus-visible, input:focus-visible {
  box-shadow: 0 0 0 calc(5 * var(--u)) var(--ring);
  border-radius: calc(6 * var(--u));
  transform: scale(1.06);
}
.strip button:focus-visible { z-index: 2; }

/* ---- buttons ------------------------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; gap: calc(12 * var(--u));
  background: var(--surface2); border: 0; border-radius: calc(6 * var(--u));
  padding: calc(16 * var(--u)) calc(28 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 700;
}
.btn.primary { background: var(--brand); color: #fff; }
.btn.ghost { background: rgba(255,255,255,.1); font-weight: 400; font-size: calc(22 * var(--u)); }
.btnrow { display: flex; gap: calc(22 * var(--u)); align-items: center; flex-wrap: wrap; margin: calc(22 * var(--u)) 0; }

/* ---- detail ------------------------------------------------------------------------------- */
.hero { position: relative; height: calc(560 * var(--u)); margin-bottom: calc(24 * var(--u)); }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,20,20,.25), var(--bg) 94%); }
.hero .title { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(24 * var(--u));
  font-size: calc(56 * var(--u)); font-weight: 700; }
.meta { color: var(--ink2); font-size: calc(20 * var(--u)); margin: calc(10 * var(--u)) 0; }

.list { margin-top: calc(30 * var(--u)); }
.line {
  display: flex; align-items: center; gap: calc(20 * var(--u));
  padding: calc(18 * var(--u)) 0;
  border: 0; border-bottom: calc(2 * var(--u)) solid var(--line);
  width: 100%; text-align: left; background: none; border-radius: 0;
}
.line .l { flex: 1 1 auto; }
.line .r { color: var(--ink3); font-size: calc(20 * var(--u)); }
.line small { display: block; color: var(--ink3); font-size: calc(18 * var(--u)); margin-top: calc(4 * var(--u)); }

/* ---- fields ------------------------------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: calc(8 * var(--u)); margin: calc(22 * var(--u)) 0; max-width: calc(900 * var(--u)); }
.field label { color: var(--ink2); font-size: calc(20 * var(--u)); }
.field input {
  background: var(--surface2); border: calc(2 * var(--u)) solid var(--line);
  border-radius: calc(8 * var(--u)); padding: calc(16 * var(--u)) calc(18 * var(--u));
  font-size: calc(22 * var(--u));
}

/* ---- player overlay ----------------------------------------------------------------------- */
body.playing { background: transparent; }
body.playing #nav, body.playing #stage { display: none; }
#now {
  position: fixed; inset: auto 0 0 0; display: none; z-index: 4;
  padding: calc(28 * var(--u)) var(--gutter) calc(34 * var(--u));
  background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0));
}
body.playing #now { display: block; }
#now .t { font-size: calc(34 * var(--u)); font-weight: 700; }
#now .s { color: var(--ink2); font-size: calc(20 * var(--u)); margin-top: calc(6 * var(--u)); }
#track { height: calc(6 * var(--u)); background: rgba(255,255,255,.2); margin-top: calc(18 * var(--u)); }
#track i { display: block; height: 100%; background: var(--brand); width: 0; }

/* ---- notes -------------------------------------------------------------------------------- */
.note { color: var(--ink2); font-size: calc(24 * var(--u)); max-width: calc(1100 * var(--u)); line-height: 1.5; margin: calc(18 * var(--u)) 0; }
.note.err { color: var(--warn); }
.h1 { font-size: calc(56 * var(--u)); font-weight: 700; margin: calc(20 * var(--u)) 0 calc(10 * var(--u)); }
.h2 { font-size: calc(34 * var(--u)); font-weight: 700; margin: calc(40 * var(--u)) 0 calc(14 * var(--u)); }
#boot {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink3); z-index: 9; font-size: calc(24 * var(--u));
}
#boot.gone { display: none; }
</style>
</head>
<body>
  <header id="nav">
    <div id="mark">SCENIX</div>
    <nav id="tabs"></nav>
    <div id="who"></div>
  </header>

  <main id="stage"></main>

  <div id="now">
    <div class="t" id="now-title"></div>
    <div class="s" id="now-status"></div>
    <div id="track"><i id="track-fill"></i></div>
    <div class="btnrow" id="now-controls"></div>
  </div>

  <div id="boot">Reading what this backend can do&hellip;</div>

<script>
"use strict";

// One base, taken from wherever the page was served: a hub and this device answer the same paths.
const V1 = "/app/v1/";

const stage = document.getElementById("stage");
const tabs = document.getElementById("tabs");

let caps = {};
let profiles = [];
let profile = null;
let view = { name: "home" };
let trail = [];
let detail = null;         // the title on screen
let resumeMs = 0;          // where the player last was
let nextEpisode = null;    // what to start when this one ends

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
};

async function api(path, opts) {
  const res = await fetch(V1 + path, opts);
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (err) { body = null; }
  if (!res.ok) {
    const e = new Error((body && body.error) || ("the backend answered " + res.status));
    e.status = res.status;
    throw e;
  }
  return body || {};
}
const send = (path, obj, method) => api(path, {
  method: method || "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(obj || {}),
});

/**
 * What the backend says it can do. A hub states it as an object of booleans; a bare list of names is
 * read as the same thing. No field at all means the backend predates the question, and nothing is
 * hidden for it.
 */
function readCapabilities(m) {
  const c = m && m.capabilities;
  if (!c) return {};
  if (Array.isArray(c)) { const o = {}; for (const k of c) o[k] = true; return o; }
  return c;
}
const stated = () => Object.keys(caps).length > 0;
function can(name) {
  // A backend that states no capabilities at all predates the question: hide nothing from it.
  if (!stated()) return true;
  return caps[name] === true;
}

// ---- reading the numbers aloud --------------------------------------------------------------
function clock(ms) {
  if (!ms || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, "0");
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + ss;
}
function human(bytes) {
  if (!bytes) return "";
  const units = ["kB", "MB", "GB", "TB"];
  let n = bytes / 1000, i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 1 : 0) + " " + units[i];
}
const minutes = (ms) => (ms ? Math.round(ms / 60000) + " min" : "");
const codes = (value) => String(value || "").split(/[,;\s]+/).map((c) => c.trim().toLowerCase()).filter(Boolean);

// ---- D-pad navigation -----------------------------------------------------------------------
// An arrow key moves to whatever is nearest in that direction — the only pointer a TV has. Tab order
// is left alone so a keyboard still works.
function focusables() {
  return Array.prototype.slice.call(document.querySelectorAll("button, input, a[href]"))
    .filter((n) => !n.disabled && n.offsetParent !== null);
}
function moveFocus(dx, dy) {
  const pool = focusables();
  if (!pool.length) return;
  const cur = document.activeElement;
  if (!cur || pool.indexOf(cur) < 0) { pool[0].focus(); return; }
  const a = cur.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const n of pool) {
    if (n === cur) continue;
    const b = n.getBoundingClientRect();
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const along = (bx - ax) * dx + (by - ay) * dy;
    if (along <= 2) continue;
    const aside = Math.abs((bx - ax) * dy - (by - ay) * dx);
    const score = along + aside * 3;
    if (score < bestScore) { bestScore = score; best = n; }
  }
  if (best) best.focus();
}
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { moveFocus(1, 0); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { moveFocus(-1, 0); e.preventDefault(); }
  else if (e.key === "ArrowDown") { moveFocus(0, 1); e.preventDefault(); }
  else if (e.key === "ArrowUp") { moveFocus(0, -1); e.preventDefault(); }
  // The shell forwards its own Back button as this key. Back closes the top-most thing.
  else if (e.key === "Backspace") { back(); e.preventDefault(); }
});
// A row scrolls itself to whatever the D-pad has landed on.
document.addEventListener("focusin", (e) => {
  if (e.target && e.target.scrollIntoView) e.target.scrollIntoView({ block: "nearest", inline: "nearest" });
});

// ---- the native player ----------------------------------------------------------------------
const bridge = () => window.Scenix || null;
const setPlaying = (on) => document.body.classList.toggle("playing", !!on);
const status = (text) => { document.getElementById("now-status").textContent = text || ""; };

function onEvent(name, d) {
  d = d || {};
  if (name === "scenix:shell") {
    if (d.device && !profile) document.getElementById("who").textContent = d.device;
    if (d.unreachable) say("This page could not load: " + d.why, true);
    return;
  }
  if (name === "scenix:position") {
    if (typeof d.positionMs === "number") resumeMs = d.positionMs;
    if (d.durationMs > 0) {
      document.getElementById("track-fill").style.width = Math.min(100, (resumeMs / d.durationMs) * 100) + "%";
    }
    status(clock(resumeMs) + (d.durationMs > 0 ? " of " + clock(d.durationMs) : "") +
      (d.playing ? "" : "  \u00B7  paused"));
    return;
  }
  if (name === "scenix:buffering") { status(d.buffering ? "Buffering\u2026" : ""); return; }
  if (name === "scenix:ready") { status("Playing"); return; }
  if (name === "scenix:video") { if (d.width) status("Playing  \u00B7  " + d.width + "x" + d.height); return; }
  if (name === "scenix:error") {
    setPlaying(false);
    say("The player stopped: " + (d.message || d.code || "unknown reason"), true);
    return;
  }
  if (name === "scenix:tracks") {
    const audio = (d.audio || []).length, text = (d.text || []).length;
    if (audio + text) status(audio + " audio, " + text + " subtitle in this file");
    return;
  }
  if (name === "scenix:ended") {
    closePlayer();
    if (nextEpisode) { const ep = nextEpisode; nextEpisode = null; playTitle(detail, null, 0, ep.season, ep.episode); }
    return;
  }
}
window.__scenix = onEvent;

function closePlayer() {
  setPlaying(false);
  const b = bridge();
  if (b) { try { b.stop(); } catch (err) { /* it is already stopped */ } }
}

// ---- screens --------------------------------------------------------------------------------
function say(text, isError) {
  let n = document.getElementById("statusline");
  if (!n) { n = el("div", "note"); n.id = "statusline"; stage.appendChild(n); }
  n.textContent = text;
  n.classList.toggle("err", !!isError);
  return n;
}
function only(text, isError) {
  stage.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("p", "note" + (isError ? " err" : ""), text));
  stage.appendChild(pad);
}

function card(it) {
  const b = el("button", "card");
  const art = el("div", "art");
  if (it.poster) {
    const img = el("img");
    img.src = it.poster;
    img.loading = "lazy";
    img.onerror = () => { art.innerHTML = ""; art.appendChild(el("div", "none", it.title)); };
    art.appendChild(img);
  } else {
    art.appendChild(el("div", "none", it.title));
  }
  if (it.maturity) art.appendChild(el("span", "badge" + (it.kids ? " kids" : ""), it.maturity));
  if (it.progress && it.progress.positionMs && it.durationMs) {
    const bar = el("div", "bar");
    const fill = el("i");
    fill.style.width = Math.min(100, (it.progress.positionMs / it.durationMs) * 100) + "%";
    bar.appendChild(fill);
    art.appendChild(bar);
  }
  b.appendChild(art);
  b.appendChild(el("div", "cap", it.title + (it.year ? "  \u00B7  " + it.year : "")));
  b.onclick = () => openTitle(it.identity, it.type);
  return b;
}

function renderRows(rows, emptyText, allowAddons) {
  stage.innerHTML = "";
  const pad = el("div", "pad");
  const shown = (rows || []).filter((r) => r.items && r.items.length);
  if (!shown.length) {
    pad.appendChild(el("p", "note", emptyText));
    if (allowAddons) {
      const b = el("button", "btn primary", "Add an addon");
      b.onclick = () => go({ name: "settings" });
      pad.appendChild(b);
    }
    stage.appendChild(pad);
    return;
  }
  for (const r of shown) {
    pad.appendChild(el("h2", "rowtitle", r.title || r.id));
    const strip = el("div", "strip");
    for (const it of r.items) strip.appendChild(card(it));
    pad.appendChild(strip);
  }
  stage.appendChild(pad);
  const first = stage.querySelector("button");
  if (profile || it_isProfiles()) { /* the first card is where the D-pad starts */ }
  if (firstCard()) firstCard().focus();
}
function firstCard() { return stage.querySelector(".strip button"); }
function it_isProfiles() { return view.name === "profiles"; }

async function openTitle(identity, type) {
  only("Opening\u2026");
  let it;
  try {
    const found = await api("meta/" + encodeURIComponent(identity) + (type ? "?type=" + encodeURIComponent(type) : ""));
    it = found.item || found;
  } catch (err) { only(err.message, true); return; }
  detail = it;
  renderDetail(it);
}

function renderDetail(it) {
  stage.innerHTML = "";
  const hero = el("div", "hero");
  if (it.backdrop) { const img = el("img"); img.src = it.backdrop; hero.appendChild(img); }
  hero.appendChild(el("div", "scrim"));
  hero.appendChild(el("h1", "title", it.title));
  stage.appendChild(hero);

  const pad = el("div", "pad");
  const bits = [];
  if (it.year) bits.push(it.year);
  if (it.maturity) bits.push(it.maturity);
  if (it.durationMs) bits.push(minutes(it.durationMs));
  if (it.genres && it.genres.length) bits.push(it.genres.join(", "));
  pad.appendChild(el("div", "meta", bits.join("  \u00B7  ")));
  if (it.inCinemas) pad.appendChild(el("div", "meta", "In cinemas \u2014 no file exists for this one yet."));

  const sources = it.sources || [];
  const actions = el("div", "btnrow");
  if (!sources.length) {
    pad.appendChild(el("p", "note", "No source answers for this title. An addon has to reply to the stream request before anything can be played."));
  } else {
    const play = el("button", "btn primary", (it.progress && it.progress.positionMs) ? "Resume" : "Play");
    play.onclick = () => playTitle(it, sources[0], (it.progress && it.progress.positionMs) || 0, 0, 0);
    actions.appendChild(play);
    if (it.progress && it.progress.positionMs) {
      const again = el("button", "btn ghost", "Start again");
      again.onclick = () => playTitle(it, sources[0], 0, 0, 0);
      actions.appendChild(again);
    }
    pad.appendChild(actions);

    const list = el("div", "list");
    list.appendChild(el("div", "h2", "Ways to watch"));
    for (const s of sources) {
      const line = el("button", "line");
      const left = el("div", "l");
      left.appendChild(el("div", null, s.label || s.quality || s.kind));
      left.appendChild(el("small", null, [s.kind, s.mode, s.provider].filter(Boolean).join("  \u00B7  ")));
      line.appendChild(left);
      if (s.sizeBytes) line.appendChild(el("div", "r", human(s.sizeBytes)));
      line.onclick = () => playTitle(it, s, 0, 0, 0);
      list.appendChild(line);
    }
    pad.appendChild(list);
  }

  if (it.episodes && it.episodes.length) {
    const list = el("div", "list");
    list.appendChild(el("div", "h2", "Episodes"));
    for (const ep of it.episodes) {
      const line = el("button", "line");
      line.appendChild(el("div", "l",
        "S" + String(ep.season).padStart(2, "0") + "E" + String(ep.episode).padStart(2, "0") +
        (ep.title ? "  \u2014  " + ep.title : "")));
      line.onclick = () => playTitle(it, null, 0, ep.season, ep.episode);
      list.appendChild(line);
    }
    pad.appendChild(list);
  }
  if (it.subtitleLanguages && it.subtitleLanguages.length) {
    pad.appendChild(el("div", "meta", "Subtitles offered in: " + it.subtitleLanguages.join(", ")));
  }
  stage.appendChild(pad);
  const first = stage.querySelector("button");
  if (first) first.focus();
}

/**
 * Ask the backend for a stream, then hand it to the player. `season`/`episode` name one episode of a
 * series; the backend turns that into the address its addons understand.
 */
async function playTitle(it, source, at, season, episode) {
  if (!it) return;
  const b = bridge();
  if (!b) { say("This page is open in a browser, not on the TV: there is no native player here to take the file.", true); return; }
  document.getElementById("now-title").textContent = it.title +
    (season && episode ? "  \u2014  S" + String(season).padStart(2, "0") + "E" + String(episode).padStart(2, "0") : "");
  status("Asking the backend for a stream\u2026");
  setPlaying(true);
  const body = { identity: it.identity, type: it.type, profile: profile ? profile.id : "" };
  if (source && source.provider) body.source = source.provider;
  if (season) body.season = season;
  if (episode) body.episode = episode;
  let target;
  try { target = await send("play", body); }
  catch (err) { setPlaying(false); say(err.message, true); return; }
  if (!target.url) { setPlaying(false); say(target.error || "The backend had nothing to play.", true); return; }
  nextEpisode = target.nextEpisode || null;

  const subs = [];
  const langs = (it.subtitleLanguages || []).join(",");
  if (langs) {
    try {
      const found = await api("subs/" + encodeURIComponent(it.identity) +
        "?lang=" + encodeURIComponent(langs) + (it.type ? "&type=" + encodeURIComponent(it.type) : ""));
      for (const s of (found.subs || [])) {
        subs.push({ url: s.url, language: s.lang || s.language || "", label: s.label || s.lang || "", format: s.format || "vtt" });
      }
    } catch (err) { /* subtitles are an extra, never a reason not to start */ }
  }
  resumeMs = at || 0;
  try {
    b.play(JSON.stringify({
      url: target.url,
      headers: target.headers || {},
      positionMs: resumeMs,
      subs: subs,
      title: it.title,
    }));
  } catch (err) { setPlaying(false); say("The player refused this file: " + err.message, true); return; }
  status("Starting");
}

function renderSearch() {
  stage.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "h1", "Search"));
  const field = el("div", "field");
  field.appendChild(el("label", null, "A title, a genre, a language"));
  const input = el("input");
  input.type = "text";
  input.onkeydown = (e) => { if (e.key === "Enter") run(input.value); };
  field.appendChild(input);
  const go = el("button", "btn primary", "Search");
  go.onclick = () => run(input.value);
  pad.appendChild(go);
  stage.appendChild(pad);
  input.focus();

  async function run(q) {
    if (!q) return;
    only("Searching for \u201C" + q + "\u201D\u2026");
    let found;
    try { found = await api("search?q=" + encodeURIComponent(q) + "&profile=" + encodeURIComponent(profile ? profile.id : "")); }
    catch (err) { only(err.message, true); return; }
    const items = found.items || [];
    stage.innerHTML = "";
    const box = el("div", "pad");
    if (!items.length) {
      box.appendChild(el("p", "note", "Nothing matched. Only a catalogue that declares a search answers one."));
    } else {
      box.appendChild(el("h2", "rowtitle", "Results for \u201C" + q + "\u201D"));
      const strip = el("div", "strip");
      for (const it of items) strip.appendChild(card(it));
      box.appendChild(strip);
    }
    stage.appendChild(box);
    const first = box.querySelector("button");
    if (first) first.focus();
  }
}

async function renderSettings() {
  only("Reading this TV\u2019s settings\u2026");
  let s;
  try { s = await api("settings"); } catch (err) { only(err.message, true); return; }
  const settings = s.settings || s;
  stage.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "h1", "Settings"));
  pad.appendChild(el("p", "meta", can("localCache")
    ? "This TV is its own backend. Its addons, its languages and its cache live on this device."
    : "These settings belong to the hub."));

  pad.appendChild(el("h2", "h2", "Addons"));
  const addons = settings.addons || [];
  if (!addons.length) {
    pad.appendChild(el("p", "note", "No addons yet. This TV reads whatever an addon publishes \u2014 give it one manifest URL and that addon\u2019s own catalogues become rows."));
  }
  for (const a of addons) {
    const line = el("div", "line");
    line.appendChild(el("div", "l", a.name || a.url || a.manifest));
    line.appendChild(el("div", "r", a.enabled === false ? "off" : "on"));
    const remove = el("button", "btn ghost", "Remove");
    remove.onclick = async () => {
      try { await api("addons/" + encodeURIComponent(a.id || a.url || a.manifest), { method: "DELETE" }); renderSettings(); }
      catch (err) { say(err.message, true); }
    };
    line.appendChild(remove);
    pad.appendChild(line);
  }
  if (can("addonCatalogs")) {
    const field = el("div", "field");
    field.appendChild(el("label", null, "Add an addon \u2014 its manifest URL"));
    const input = el("input");
    input.type = "text";
    input.placeholder = "http://<addon-host>/manifest.json";
    field.appendChild(input);
    const add = el("button", "btn primary", "Add");
    add.onclick = async () => {
      const url = (input.value || "").trim();
      if (!/^https?:\/\//i.test(url)) { say("An addon is given as an http(s) URL.", true); return; }
      try { await send("addons", { url: url }); renderSettings(); }
      catch (err) { say(err.message, true); }
    };
    field.appendChild(add);
    pad.appendChild(field);
  }

  pad.appendChild(el("h2", "h2", "Languages"));
  pad.appendChild(el("p", "meta", "The order this household listens and reads in. Left blank, whatever a source offers first is used."));
  const audio = fieldIn(pad, "Audio languages, in order", (settings.audioLanguages || []).join(", "));
  const sub = fieldIn(pad, "Subtitle languages, in order", (settings.subtitleLanguages || []).join(", "));
  const save = el("button", "btn primary", "Save");
  save.onclick = async () => {
    try {
      await send("settings", {
        audioLanguages: codes(audio.input.value),
        subtitleLanguages: codes(sub.input.value),
      }, "PUT");
      say("Saved.");
    } catch (err) { say(err.message, true); }
  };
  pad.appendChild(save);

  if (can("localCache")) {
    const clear = el("button", "btn ghost", "Clear cached addon responses");
    clear.onclick = async () => {
      try { await send("cache/clear", {}); say("Cache cleared."); }
      catch (err) { say(err.message, true); }
    };
    pad.appendChild(clear);
  }
  stage.appendChild(pad);
  const first = stage.querySelector("input");
  if (first) first.focus();
}

function fieldIn(pad, label, value) {
  const field = el("div", "field");
  field.appendChild(el("label", null, label));
  const input = el("input");
  input.type = "text";
  input.value = value || "";
  field.appendChild(input);
  pad.appendChild(field);
  return { field: field, input: input };
}

async function renderProfiles() {
  stage.innerHTML = "";
  const pad = el("div", "pad");
  pad.appendChild(el("h1", "h1", "Who is watching?"));
  const strip = el("div", "strip");
  for (const p of profiles) {
    const b = el("button", "card");
    const art = el("div", "art");
    art.appendChild(el("div", "none", p.name || p.id));
    b.appendChild(art);
    b.appendChild(el("div", "cap", (p.name || p.id) + (p.isKids ? "  \u00B7  kids" : "")));
    b.onclick = () => enter(p);
    strip.appendChild(b);
  }
  pad.appendChild(strip);
  if (can("profileEdit")) {
    pad.appendChild(el("h2", "h2", "Add a profile"));
    const name = fieldIn(pad, "A name for this person", "");
    const kid = el("input");
    kid.type = "checkbox";
    const row = el("div", "btnrow");
    row.appendChild(kid);
    row.appendChild(el("span", "meta", "a kid\u2019s profile: only what their maturity label allows"));
    const add = el("button", "btn primary", "Add");
    add.onclick = async () => {
      const who = (name.input.value || "").trim();
      if (!who) { say("A profile needs a name.", true); return; }
      try {
        await send("profiles", { name: who, isKids: !!kid.checked });
        const p = await api("profiles");
        profiles = p.profiles || [];
        renderProfiles();
      } catch (err) { say(err.message, true); }
    };
    row.appendChild(add);
    pad.appendChild(row);
  }
  stage.appendChild(pad);
  const first = stage.querySelector("button");
  if (first) first.focus();
}

// ---- the frame ------------------------------------------------------------------------------
async function enter(p) {
  profile = p;
  document.getElementById("who").textContent = p.name || p.id;
  await go({ name: "home" });
}

async function go(next) {
  if (view.name !== next.name) trail.push(view);
  view = next;
  drawTabs();
  await show(next);
}

function back() {
  if (document.body.classList.contains("playing")) { closePlayer(); return; }
  if (trail.length) {
    const prev = trail.pop();
    view = prev;
    drawTabs();
    show(prev);
    return;
  }
  const b = bridge();
  if (b) b.exit();
}

function drawTabs() {
  tabs.innerHTML = "";
  const screens = [["home", "Home"], ["search", "Search"]];
  if (can("live")) screens.push(["live", "Live"]);
  screens.push(["settings", "Settings"]);
  screens.push(["profiles", "Profiles"]);
  for (const pair of screens) {
    const b = el("button", null, pair[1]);
    if (view.name === pair[0]) b.setAttribute("aria-current", "page");
    b.onclick = () => go({ name: pair[0] });
    tabs.appendChild(b);
  }
}

async function show(next) {
  stage.scrollTop = 0;
  if (next.name === "profiles") { await renderProfiles(); return; }
  if (next.name === "search") { renderSearch(); return; }
  if (next.name === "settings") { await renderSettings(); return; }
  let h;
  try { h = await api("home?profile=" + encodeURIComponent(profile ? profile.id : "")); }
  catch (err) { only(err.message, true); return; }
  let rows = h.rows || [];
  if (next.name === "live") {
    const live = (it) => it.type === "channel" || !!it.live;
    rows = rows.map((r) => ({ id: r.id, title: r.title, card: r.card, items: (r.items || []).filter(live) }))
      .filter((r) => r.items.length);
    renderRows(rows, "This backend has no live channels.", false);
    return;
  }
  renderRows(rows, can("localCache")
    ? "Nothing here yet. Add an addon under Settings and this TV reads that addon\u2019s own catalogues."
    : "Nothing here yet \u2014 the hub sent no rows this profile can see.", can("localCache"));
}

// ---- boot -----------------------------------------------------------------------------------
async function start() {
  let manifest;
  try { manifest = await api("manifest"); }
  catch (err) { document.getElementById("boot").textContent = "This page could not reach its backend: " + err.message; return; }
  caps = readCapabilities(manifest);
  buildPlayerControls();

  let p = { profiles: [] };
  try { p = await api("profiles"); } catch (err) { /* a backend with no profile list is a backend with one viewer */ }
  profiles = p.profiles || [];
  document.getElementById("boot").classList.add("gone");

  if (profiles.length === 1) { await enter(profiles[0]); return; }
  if (!profiles.length) { await enter({ id: "default", name: "" }); return; }
  await go({ name: "profiles" });
  trail = [];
}

function buildPlayerControls() {
  const box = document.getElementById("now-controls");
  const pause = el("button", "btn", "Pause");
  pause.onclick = () => {
    const b = bridge();
    if (!b) return;
    if (pause.textContent === "Pause") { b.pause(); pause.textContent = "Resume"; }
    else { b.resume(); pause.textContent = "Pause"; }
  };
  const back10 = el("button", "btn ghost", "Back 10s");
  back10.onclick = () => { const b = bridge(); if (b) b.skip(-10000); };
  const forward30 = el("button", "btn ghost", "Forward 30s");
  forward30.onclick = () => { const b = bridge(); if (b) b.skip(30000); };
  const stop = el("button", "btn ghost", "Stop");
  stop.onclick = () => closePlayer();
  box.appendChild(pause);
  box.appendChild(back10);
  box.appendChild(forward30);
  box.appendChild(stop);
}

start();
</script>
